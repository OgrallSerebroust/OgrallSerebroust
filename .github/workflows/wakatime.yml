name: Waka README
on:
  schedule:
    - cron: "*/5 * * * *"
    # - cron: "0 */12 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-readme:
    name: Update README with WakaTime stats
    runs-on: ubuntu-latest
    steps:
      - uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
      # - uses: actions/checkout@v4
      # - uses: athul/waka-readme@master