name: Waka README updater
on:
  # schedule:
    # - cron: "*/5 * * * *"
    # - cron: "0 */12 * * *"
  workflow_dispatch:
jobs:
  update-readme:
    name: Update README with WakaTime stats
    runs-on: ubuntu-latest
    steps:
      - uses: anmol098/waka-readme-stats@master
        with:
          BAR_COLOR: "#5FABEE"
          BAR_RADIUS: "5"
          BAR_STYLE: "svg"
          BAR_TRACK_COLOR: "#152440"
          COMMIT_BY_ME: "True"
          COMMIT_EMAIL: "stefplotva@gmail.com"
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          IGNORED_REPOS: ""
          MAX_REPOS: "0"
          SHOW_AI_CODE_TIME: "True"
          SHOW_AI_CODING: "True"
          SHOW_EDITORS: "True"
          SHOW_COMMIT: "True"
          SHOW_DAYS_OF_WEEK: "True"
          SHOW_LANGUAGE: "True"
          SHOW_LANGUAGE_PER_REPO: "True"
          SHOW_LINES_OF_CODE: "True"
          SHOW_LOC_CHART: "True"
          SHOW_OS: "True"
          SHOW_PROFILE_VIEWS: "True"
          SHOW_PROJECTS: "True"
          SHOW_SHORT_INFO: "True"
          SHOW_TIMEZONE: "False"
          SHOW_TOTAL_CODE_TIME: "True"
          SHOW_UPDATED_DATE: "False"
          TEXT_PRIMARY_COLOR: "#5FABEE"
          TEXT_SECONDARY_COLOR: "#152440"
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}